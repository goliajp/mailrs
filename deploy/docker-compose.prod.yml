# docker-compose.prod.yml — canonical prod topology (fastcore mode).
#
# Prod (t02.golia.jp) runs the 4-process fastcore stack; there is no
# monolith mailrs container and no postgres/spg in the serving path.
# All mailrs roles ship in one image, selected per-service by
# entrypoint. `MAILRS_VERSION` in the host `.env` pins the image tag;
# release.yml sets it and runs `docker compose up -d` on every v* tag.
#
#   receiver        SMTP inbound (25/465/587), antispam verdict, writes
#                   /data/.spool — never touches kevy-fastcore or spg
#   fastcore        kevy-backed core: core-api RPC :3301 (host :3201),
#                   IMAP 143/993, POP3 110/995, spool drain, sieve,
#                   self-heal, live contacts sync
#   webapi-fc       REST + web UI :3100 (host 127.0.0.1:3103, nginx
#                   terminates TLS). Static UI comes from the host
#                   bind mount /apps/mailrs/web (owned by the web-v*
#                   release lane — rsync lands instantly, no container
#                   restart). The image's baked /opt/mailrs/web copy is
#                   only a bootstrap source for that directory.
#   fastcore-sender outbound SMTP: drains mailrs:outbound:pending from
#                   network kevy, DKIM-signs, MX + STARTTLS delivery
#   kevy-server     network kevy (sessions, queue, sieve, contacts,
#                   calendar/DAV, cross-process notify)
#
# Deploy: scp this file to /apps/mailrs/docker-compose.prod.yml, then
#   cd /apps/mailrs && docker compose -p mailrs -f docker-compose.prod.yml \
#     pull && docker compose -p mailrs -f docker-compose.prod.yml up -d
# Project name MUST stay `mailrs` so the existing mailrs_mailrs-data
# volume and mailrs_default network line up.

# who signs outbound mail: fastcore-sender signs with it, and webapi-fc's
# domain check reports the selector each domain is signed with. one
# definition so the check cannot drift from the signer.
x-dkim-identity: &dkim-identity
  MAILRS_DKIM_DOMAIN: golia.jp
  MAILRS_DKIM_SELECTOR: mail
  # Per-domain signing keys. Without this every hosted domain signs
  # d=golia.jp, which only stays aligned while SPF covers the hop —
  # any forward breaks DMARC. All seven domains publish the same
  # public key, so one file serves them all.
  MAILRS_DKIM_KEYS: ${MAILRS_DKIM_KEYS:-}

# where fastcore's IMAP listeners bind, and so the ports webapi-fc's
# autoconfig tells mail apps to use. one definition so they cannot differ.
x-imap-listeners: &imap-listeners
  MAILRS_IMAP_BIND: 0.0.0.0:143
  MAILRS_IMAPS_BIND: 0.0.0.0:993

services:
  receiver:
    container_name: mailrs-receiver
    image: ghcr.io/goliajp/mailrs:${MAILRS_VERSION:?set MAILRS_VERSION in .env}
    entrypoint: ["mailrs-receiver"]
    pull_policy: always
    mem_limit: 2g
    # no web server in the receiver — the image default healthcheck
    # curls :3100 and flags a perfectly healthy receiver unhealthy
    healthcheck:
      disable: true
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    environment:
      MAILRS_HOSTNAME: mail.golia.ai
      MAILRS_LOCAL_DOMAINS: golia.jp,golia.ai,dadaya.jp,marspot.com,bitreits.com,doracawl.com,madcawl.com,mock.golia.jp
      # disposable test mailboxes; every process that touches them reads it
      MAILRS_MOCK_DOMAIN: mock.golia.jp
      # Somebody sending as this company from an address that is not it
      # — `mailrs-fraud`. Full names only: `golia` as a substring
      # matches 490 GitHub notifications carrying a `goliajp/…` path.
      MAILRS_ORG_NAMES: GOLIA株式会社,GOLIA K.K.
      MAILRS_FRAUD_RULES_FILE: /fraud-rules/active.lua
      # Services that carry the company's name because we told them to.
      # Slack's workspace is legitimately called GOLIA株式会社, and its
      # notifications are three of the twelve messages that match.
      MAILRS_ORG_NAME_ALLOWED_DOMAINS: slack.com,github.com,atlassian.net
      MAILRS_SPOOL_ROOT: /data/.spool
      MAILRS_MAILDIR: /data/maildir
      MAILRS_USERS_FILE: /data/users.toml
      MAILRS_KEVY_URL: kevy://kevy-server:6379
      # submission auth reads account password hashes from the core
      MAILRS_CORE_RPC_BASE: ${MAILRS_CORE_RPC_BASE:-http://mailrs-fastcore:3301}
      MAILRS_CORE_API_SECRET: ${MAILRS_CORE_API_SECRET}
      MAILRS_ANTISPAM_ENABLED: "true"
      MAILRS_TLS_CERT: /certs/fullchain.pem
      MAILRS_TLS_KEY: /certs/privkey.pem
      RUST_LOG: info
    volumes:
      - mailrs-data:/data
      - /apps/mailrs/fraud-rules:/fraud-rules:ro
      - /apps/mailrs/certs:/certs:ro
    restart: unless-stopped

  fastcore:
    container_name: mailrs-fastcore
    image: ghcr.io/goliajp/mailrs:${MAILRS_VERSION:?set MAILRS_VERSION in .env}
    entrypoint: ["mailrs-fastcore"]
    pull_policy: always
    # 3g, not 1g: booting replays the full kevy AOF (~1.8GB / 12.8M cmds
    # on prod) whose transient peak exceeds 1g even though steady state is
    # ~330MB. At 1g the replay hit the cgroup limit and the container
    # restart-looped, never binding :3301 (2026-07-16 outage). Headroom
    # also absorbs the slow allocator high-water creep between restarts.
    # 4g, not 3g: the OCR child (mailrs-fastcore-ocr) counts against the
    # same limit, up to 540MB measured on one page, while fastcore itself
    # sits at about 2GB. At the limit the kernel kills the largest process,
    # which is fastcore, not the child.
    mem_limit: 4g
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:3201:3301"
      - "143:143"
      - "993:993"
      - "110:110"
      - "4190:4190"
      - "995:995"
    # The flush on the way out decides whether the next replay is clean,
    # and a SIGKILL in the middle of it leaves a torn frame at the AOF
    # tail. Measured 2026-08-16: the graceful stop takes 0.65 s, so this
    # is not about needing a minute — it is about `stop_grace_period`
    # never being one of the candidate explanations when a tail tears.
    stop_grace_period: 60s
    environment:
      MAILRS_FASTCORE_BIND: 0.0.0.0:3301
      <<: *imap-listeners
      MAILRS_KEVY_DATA_DIR: /data/kevy-fastcore
      # Transparent tiering budget in MB, or `auto` for 70% of the
      # cgroup limit. Unset = off (everything stays in RAM). Cold
      # values move to a vlog on disk and read back transparently.
      MAILRS_KEVY_TIER_MB: ${MAILRS_KEVY_TIER_MB:-}
      # Canary over (2026-07-26): 4.0 ran clean through four mail-flow
      # gates, so rewrite is allowed and the AOF converts to v2 (every
      # record length-prefixed + CRC32C). One-way — 3.18 cannot read v2.
      # Backup taken and verified immediately before flipping this.
      MAILRS_KEVY_AOF_REWRITE: ${MAILRS_KEVY_AOF_REWRITE:-on}
      MAILRS_MAILDIR: /data/maildir
      MAILRS_SPOOL_ROOT: /data/.spool
      # The same fraud policy the receiver is given, because the
      # re-scan sweep lives in *this* process and reads it from the
      # environment. It was set only on the receiver until 2026-08-28,
      # so `maintenance:fraud-rescan` ran here with an empty org-name
      # list and the impersonation rule could not fire at all — half
      # the checks, silently, on the only lane that runs the sweep.
      # Kept identical to the receiver's block above; a copy that
      # drifts is a sweep that judges by different rules than the
      # receive path.
      MAILRS_LOCAL_DOMAINS: golia.jp,golia.ai,dadaya.jp,marspot.com,bitreits.com,doracawl.com,madcawl.com,mock.golia.jp
      # disposable test mailboxes; every process that touches them reads it
      MAILRS_MOCK_DOMAIN: mock.golia.jp
      # Which stamp on `Authentication-Results:` is ours. The fraud
      # rescan reads it to tell mail that arrived from a stranger
      # from mail our own people submitted; unset, it says so and
      # the rules that need it decline.
      MAILRS_HOSTNAME: mail.golia.ai
      MAILRS_ORG_NAMES: GOLIA株式会社,GOLIA K.K.
      MAILRS_FRAUD_RULES_FILE: /fraud-rules/active.lua
      MAILRS_ORG_NAME_ALLOWED_DOMAINS: slack.com,github.com,atlassian.net
      MAILRS_SRS_SECRET: ${MAILRS_SRS_SECRET:-}
      # Must be an FQDN: it becomes Reporting-MTA in every DSN we
      # originate, and the old "mailrs" default is not resolvable.
      MAILRS_HELO_HOSTNAME: ${MAILRS_HELO_HOSTNAME:-mail.golia.ai}
      # Domain for MAILER-DAEMON@… on DSNs. Organisational domain, not
      # the MTA hostname: a subdomain there would fall under sp=reject
      # and would need its own DKIM key published. golia.ai has an
      # aligned key, so DSNs pass DMARC as-is.
      MAILRS_DSN_FROM_DOMAIN: ${MAILRS_DSN_FROM_DOMAIN:-golia.ai}
      MAILRS_CORE_API_SECRET: ${MAILRS_CORE_API_SECRET}
      MAILRS_KEVY_URL: kevy://kevy-server:6379
      # APNs push. The key itself is on the host at
      # /apps/mailrs/secrets/ and mounted read-only below — it is not in
      # this repository and never should be. Absent = push disabled.
      MAILRS_APNS_KEY_PATH: /secrets/AuthKey_XMYSNWTV4B.p8
      MAILRS_APNS_KEY_ID: XMYSNWTV4B
      MAILRS_APNS_TEAM_ID: KF79DRC524
      MAILRS_APNS_TOPIC: jp.golia.mailrs
      # Sandbox, deliberately, and not set here: the app is installed
      # from Xcode, which signs it with `aps-environment: development`,
      # and a development token pushed at the production gateway comes
      # back `BadDeviceToken` — which the sender reads as "unregistered"
      # and prunes, so every device would silently unsubscribe itself.
      # Set this to https://api.push.apple.com the day the app ships
      # through TestFlight or the App Store.
      # MAILRS_APNS_ENDPOINT: https://api.push.apple.com
      MAILRS_ALIAS_STORE_BACKEND: network
      MAILRS_TLS_CERT: /certs/fullchain.pem
      MAILRS_TLS_KEY: /certs/privkey.pem
      RUST_LOG: info
    volumes:
      - mailrs-data:/data
      - /apps/mailrs/fraud-rules:/fraud-rules:ro
      - /apps/mailrs/certs:/certs:ro
      # The APNs key. Read-only, and the reason `MAILRS_APNS_KEY_PATH`
      # was inert before: the variable named /secrets and nothing
      # mounted it, so a fully configured push logged "key file
      # unreadable — push disabled" and looked like a bad key.
      #
      # The host directory must be owned by **10001:10001** — the
      # `mailrs` user this image runs as. Left as root:root 600 it is
      # unreadable inside the container and says exactly the same thing
      # a wrong key does:
      #
      #   chown -R 10001:10001 /apps/mailrs/secrets
      #   chmod 500 /apps/mailrs/secrets
      #   chmod 400 /apps/mailrs/secrets/AuthKey_*.p8
      - /apps/mailrs/secrets:/secrets:ro
    restart: unless-stopped

  webapi-fc:
    container_name: mailrs-webapi-fc
    image: ghcr.io/goliajp/mailrs:${MAILRS_VERSION:?set MAILRS_VERSION in .env}
    entrypoint: ["mailrs-webapi"]
    pull_policy: always
    mem_limit: 1g
    ports:
      - "127.0.0.1:3103:3100"
    environment:
      # whichever core runs answers here: fastcore, or the SQL core when
      # docker-compose.pg-core.yml is layered on this file
      MAILRS_CORE_RPC_BASE: ${MAILRS_CORE_RPC_BASE:-http://mailrs-fastcore:3301}
      MAILRS_CORE_API_SECRET: ${MAILRS_CORE_API_SECRET}
      MAILRS_KEVY_URL: kevy://kevy-server:6379
      # Caddy on the host reaches the published port through docker-proxy,
      # which connects from the network's gateway; only that address may
      # name the client in X-Forwarded-For. webapi logs an error if another
      # private address starts forwarding (a recreated network moves it)
      MAILRS_TRUSTED_PROXIES: 172.18.0.1/32
      # the login guard's alerts, mailed as a digest at most every 5 minutes
      MAILRS_SECURITY_ALERT_TO: lihao@golia.jp
      MAILRS_SECURITY_ALERT_FROM: noreply@golia.jp
      MAILRS_WEB_BIND: 0.0.0.0:3100
      MAILRS_WEB_STATIC_DIR: /opt/mailrs/web
      MAILRS_MAILDIR: /data/maildir
      MAILRS_MOCK_DOMAIN: mock.golia.jp
      MAILRS_HOSTNAME: mail.golia.ai
      # the domain check reads only domain and selector, never the key files
      <<: [*dkim-identity, *imap-listeners]
      RUST_LOG: info
    volumes:
      - mailrs-data:/data
      # web UI owned by the web-v* lane; release-web.yml rsyncs into
      # this host dir and the container picks it up without a restart
      - /apps/mailrs/web:/opt/mailrs/web:ro
    restart: unless-stopped

  fastcore-sender:
    container_name: mailrs-fastcore-sender
    image: ghcr.io/goliajp/mailrs:${MAILRS_VERSION:?set MAILRS_VERSION in .env}
    entrypoint: ["mailrs-fastcore-sender"]
    pull_policy: always
    mem_limit: 256m
    healthcheck:
      disable: true
    environment:
      MAILRS_KEVY_URL: kevy://kevy-server:6379
      # EHLO name must match the PTR of the sending IP (FCrDNS).
      # 52.195.89.111 reverses to mail.golia.ai, so announcing
      # mail.golia.jp costs reputation points at strict receivers even
      # though both A records point here.
      MAILRS_HELO_HOSTNAME: mail.golia.ai
      # sender originates its own DSNs (delivery-failure bounces), so it
      # needs the same identity split as fastcore. Without this the
      # fallback yields MAILER-DAEMON@mail.golia.ai — a subdomain, which
      # lands under sp=reject with no aligned key.
      MAILRS_DSN_FROM_DOMAIN: ${MAILRS_DSN_FROM_DOMAIN:-golia.ai}
      # No MAILRS_SENDER_MAX_ATTEMPTS here on purpose. It said "10", and
      # with the flat 60-second floor that made a message's whole life
      # ten minutes — shorter than the propagation delay of the very
      # unblock that would have delivered it (2026-08-17, Microsoft
      # S3140). The bound is now the queue lifetime, five days, per
      # RFC 5321 §4.5.4.1; the attempt cap survives only as a backstop
      # against a pathological loop and the code's 100 is the right
      # value for that. Pinning 10 here would have quietly capped the
      # new schedule at about 23 hours — a compose knob overriding the
      # policy it was written before.
      MAILRS_SENDER_POLL_MS: "500"
      MAILRS_SENDER_RETRY_MIN_SECS: "60"
      <<: *dkim-identity
      MAILRS_DKIM_PRIVATE_KEY: /dkim/golia.jp.key
      # mail to the mock domain is stored under /data/mock, never sent
      MAILRS_MOCK_DOMAIN: mock.golia.jp
      RUST_LOG: info
    volumes:
      - /apps/mailrs/dkim:/dkim:ro
      - mailrs-data:/data
    restart: unless-stopped

  kevy-server:
    container_name: mailrs-kevy
    # 6.2.2 since 2026-09-01. It fixes what this project reported: a
    # second engine on one persist directory used to interleave —
    # appending its own `KEVYAOF2` magic into the live AOF, which the
    # next replay quarantined silently — and now refuses with an
    # advisory `flock`. Rehearsed on a copy the same way: four shards
    # (clean), `bayes` 27,104 against 27,104, every prefix without a
    # TTL +0.
    #
    # 6.2.1 since 2026-08-31, from 5.1.0. Rehearsed on a copy of the
    # production directory on t02 before the swap, the same way 5.1.0
    # was: four AOF shards replayed **(clean)**, 1,305,342 commands
    # from 243 MB, and `bayes` — the trained corpus, the one thing
    # here that cannot be rebuilt — came back 27,104 against 27,104.
    # Every prefix without a TTL was +0; the four that differed (rl,
    # gl, ag, session) are TTL'd and rebuildable, and the difference
    # is the two instances' lazy-expiry progress, not the version:
    # `TTL` answers -2 for the same keys `KEYS` lists on **both**.
    # Five `bayes` values and four `mailrs` keys of four different
    # types compared identically byte for byte.
    #
    # Reconcile on per-prefix `KEYS` counts, never `DBSIZE`: the two
    # versions report it differently for the same store.
    #
    # Rolling back is a binary swap ONLY until the first BGREWRITEAOF.
    # That rewrite flips the on-disk format, and the older server does
    # not refuse the newer one: it starts, calls each shard corrupt,
    # drops the trailing bytes and comes up with 1 key instead of
    # 33,636. Nothing on disk is lost unless it is then written to.
    # After a rewrite the only rollback is restoring the directory —
    # `/apps/mailrs/kevy-backup-20260831-1422` is the copy taken
    # before this swap.
    image: ghcr.io/goliajp/kevy:6.4.0
    pull_policy: always
    mem_limit: 1g
    volumes:
      - kevy-server-data:/data
      - /apps/mailrs/kevy.toml:/etc/kevy/kevy.toml:ro
    restart: unless-stopped


volumes:
  mailrs-data:
  kevy-server-data:


# The address webapi trusts to forward client addresses
# (MAILRS_TRUSTED_PROXIES) is this network's gateway, so the network is
# pinned to the subnet it was first created with: a recreated network
# must not come back with another gateway.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
