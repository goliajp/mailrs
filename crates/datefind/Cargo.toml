[package]
name = "mailrs-datefind"
version = "1.0.0"
edition = "2024"
description = "Find the dates and times a person wrote in prose — \"August 21 at 2pm\", \"8月21日 14:00\" — so a client can offer to put them in a calendar. Proposes; never files."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
homepage = "https://github.com/goliajp/mailrs"
documentation = "https://docs.rs/mailrs-datefind"
authors = ["GOLIA K.K."]
keywords = ["date", "parser", "calendar", "email", "text"]
categories = ["date-and-time", "parser-implementations", "email"]

[dependencies]
chrono = "0.4"
