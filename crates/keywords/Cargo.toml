[package]
name = "mailrs-keywords"
version = "0.1.0"
edition = "2024"
description = "Dovecot-compatible `dovecot-keywords` reader and writer: the map from a Maildir++ keyword bit (a lowercase letter in the `:2,` suffix) to the name it stands for, stored beside the mail."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
homepage = "https://github.com/goliajp/mailrs"
documentation = "https://docs.rs/mailrs-keywords"
authors = ["GOLIA K.K."]
keywords = ["email", "imap", "maildir", "keywords", "dovecot"]
categories = ["email", "filesystem"]
readme = "README.md"

[lints]
workspace = true

[dependencies]

[dev-dependencies]
tempfile = "3"
