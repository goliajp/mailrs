[package]
name = "mailrs-pop3-client"
version = "1.0.0"
edition = "2024"
description = "Reading a mailbox over POP3: response parsing and UIDL-based deduplication, with the socket half optional."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
homepage = "https://github.com/goliajp/mailrs"
documentation = "https://docs.rs/mailrs-pop3-client"
authors = ["GOLIA K.K."]
keywords = ["pop3", "email", "client", "rfc1939", "uidl"]
categories = ["email", "parser-implementations"]
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# The socket half. Off by default so the parsing and the deduplication
# stay testable without pulling in a TLS stack.
net = ["dep:tokio", "dep:tokio-rustls", "dep:rustls", "dep:mailrs-smtp-client"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
# For the trust anchors: the platform store *and* the Mozilla set, the
# same pair SMTP and IMAP verify against.
mailrs-smtp-client = { path = "../smtp-client", version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-util", "net", "time"] }
