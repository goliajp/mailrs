[package]
name = "mailrs-mail-builder"
version = "1.0.2"
edition = "2024"
description = "RFC 5322 / 2046 / 2047 / 2231 outbound mail builder. Constructs canonically-compliant raw bytes for plain-text, multipart/alternative, and multipart/mixed messages — encoded-word headers, soft-fold lines, CTE selection (7bit / quoted-printable / base64), boundary collision-scan. The inverse of the mailrs-rfc5322, mailrs-rfc2047 and mailrs-mime parsers."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
homepage = "https://github.com/goliajp/mailrs"
documentation = "https://docs.rs/mailrs-mail-builder"
authors = ["GOLIA K.K."]
keywords = ["email", "rfc5322", "mime", "builder", "encoder"]
categories = ["email", "encoding"]
readme = "README.md"
# needs Docker and the in-repo test helper crate, neither of which ships
exclude = ["tests/mta_interop.rs"]

[lints]
workspace = true

[dependencies]
# encoded-word encoding (B/Q selection) comes from mailrs-rfc2047; no
# other runtime dependencies beyond base64, chrono and memchr
mailrs-rfc2047 = { path = "../rfc2047", version = "1" }
base64 = "0.22"
chrono = { workspace = true }
# SIMD byte scanner — replaces the windows()-style search loops in
# strict.rs (header-terminator scan) and multipart.rs (boundary
# collision check).
memchr = "2"

[dev-dependencies]
mailrs-test-docker = { path = "../test-docker" }
mailrs-rfc5322 = { path = "../rfc5322", version = "1" }
mailrs-mime = { path = "../mime", version = "2" }
mail-parser = "0.11"  # independent parser the round-trip tests compare against
proptest = "1"
criterion = { workspace = true }
# cross-MTA interop: SMTP-submit to a real Mailpit
# container and verify the stored bytes match what we sent.
testcontainers = "0.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { workspace = true }

[[bench]]
name = "mail_builder"
harness = false
