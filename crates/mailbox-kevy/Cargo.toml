[package]
name = "mailrs-mailbox-kevy"
version = "0.0.1"
edition = "2024"
description = "Experimental kevy-backed mailbox store — implements the same surface as PgMailboxStore via in-process kevy (no PG/SPG)."
license = "Apache-2.0 OR MIT"
publish = false

[lints]
workspace = true

[dependencies]
kevy-embedded = { workspace = true }
mailrs-mailbox = { path = "../mailbox" }
mailrs-rfc5322 = { path = "../rfc5322", version = "1" }
mailrs-alias-store = { path = "../alias-store" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
async-trait = "0.1"
thiserror = "2"
chrono = { workspace = true }
# Pinned to kevy-embedded's version, deliberately: two generations of
# kevy-index in one binary is the same duplication check-workspace-deps.sh
# exists to catch. Only `WhereClause` / `CompositeCol` / `composite_bounds`
# come from here — everything else goes through the facade. See
# `src/table_spec.rs`.
#
# **It must be bumped by hand with it**, and on 2026-08-31 it was not:
# the workspace went to 6.2.1 and this stayed at 5.4, which put two
# generations of the crate in the graph exactly as the sentence above
# says not to. The compiler caught it — `expected ValType, found
# IndexValType`, with "there are multiple different versions of crate
# `kevy_index`" underneath — because the two types are structurally
# identical and differ only by which copy they came from. A comment
# stating an invariant does not maintain it; `scripts/check-kevy-versions.sh`
# now does.
kevy-index = "6.2.2"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "store_ops"
harness = false
