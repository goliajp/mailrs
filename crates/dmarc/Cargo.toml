[package]
name = "mailrs-dmarc"
version = "3.0.0"
edition = "2024"
description = "DMARC (RFC 7489) aggregate report generation: result recording, XML report builder, report-mail formatter, rua extraction. Pluggable store trait with an in-memory reference impl and a contract check."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
homepage = "https://github.com/goliajp/mailrs"
documentation = "https://docs.rs/mailrs-dmarc"
authors = ["GOLIA K.K."]
keywords = ["dmarc", "email", "spf", "dkim", "rfc7489"]
categories = ["email"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
flate2 = "1"
thiserror = "2"
# Canonical RFC 5322 builder for the aggregate-report email
# envelope. format_report_email constructs the message via
# MessageBuilder + Attachment to keep encoding / folding / boundary
# semantics consistent with the rest of mailrs's outbound stack.
mailrs-mail-builder = { path = "../mail-builder", version = "1" }
# Inline-short-string for domain fields that flow in from dkim 2.0 / spf 2.0.
compact_str = "0.9"
# Public Suffix List for organizational-domain extraction (DMARC relaxed
# alignment, RFC 7489 §3.2). Compile-time PSL, no runtime download.
psl = "2"

serde = { workspace = true, features = ["derive"] }
quick-xml = { version = "0.42", features = ["serialize"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
mailrs-mime = { version = "2.0.1", path = "../mime" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "report"
harness = false
