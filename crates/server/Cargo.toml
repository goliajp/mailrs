[package]
name = "mailrs-server"
version.workspace = true
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "The SQL core (mailrs-pg-core): the core-api, spool drain and mail protocols over PostgreSQL or spg. Not deployed."
publish = false

[lints]
workspace = true

[features]
default = []
# Swap the SQL backend from PostgreSQL (default) to spg-embedded —
# the in-process engine; no postgres container, no TCP. Flips the
# BackendPool type alias in this crate AND in every sqlx-using stone.
spg = [
    "dep:spg-sqlx",
    "dep:spg-embedded",
    "mailrs-mailbox/spg",
]

[dependencies]
mailrs-smtp-proto = { path = "../smtp-proto", version = "1" }
mailrs-maildir = { path = "../storage-maildir", version = "1.2" }
mailrs-message-store = { path = "../message-store" }
mailrs-receiver = { path = "../receiver" }
mailrs-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12", "std"] }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
dashmap = "6"
mailrs-smtp-codec = { path = "../smtp-codec", version = "1" }
mailrs-mail-protocols = { path = "../mail-protocols" }
mailrs-attachment-extract = { path = "../attachment-extract", version = "1" }
mailrs-imap-proto = { path = "../imap-proto", version = "2" }
mailrs-intelligence = { path = "../intelligence", version = "4" }
mailrs-mailbox = { path = "../mailbox", version = "2" }
mailrs-alias-store = { path = "../alias-store" }
mailrs-alias-store-net = { path = "../alias-store-net" }
mailrs-core-api = { path = "../core-api", features = ["server"] }
mailrs-core-sidestate = { path = "../core-sidestate" }
mailrs-intake = { path = "../intake" }
mailrs-clean = { path = "../clean", version = "1" }
mailrs-inbound = { path = "../inbound", version = "2" }
# Path, not the published version: `addr_key` (the one address comparison
# for the whole tree) is newer than what is on crates.io.
mailrs-rfc5322 = { path = "../rfc5322", version = "1" }
mailrs-rfc2047 = { path = "../rfc2047", version = "1" }
mailrs-tls-reload = { path = "../tls-reload", version = "1" }
mailrs-acme = { path = "../acme", version = "1" }
mailrs-mime = { path = "../mime", version = "2" }
sqlx = { workspace = true }
spg-sqlx = { workspace = true, optional = true }
spg-embedded = { workspace = true, optional = true }
kevy-embedded = { workspace = true }
kevy-client = { workspace = true }
mailrs-triage = { path = "../triage" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = { workspace = true }
password-hash = { workspace = true }
rand_core = { workspace = true }
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
html2text = "0.17"
tempfile = "3"

[dev-dependencies]
mailrs-test-docker = { path = "../test-docker" }
# Receiving-path e2e regression baseline (tests/e2e_receiving.rs) spins up
# a real pgvector container — same image + version the mailbox crate's
# fixtures use. Pre-pulled in CI's test.yml. tokio / sqlx / tempfile /
# mailrs-maildir come from [dependencies] (available to integration tests).
testcontainers = "0.27"
mailrs-core-api = { path = "../core-api", features = ["client", "server"] }
# cross-backend sync test (core_rpc pg_core_tests): spawn a kevy fastcore
# alongside the spg pg-core and run mailrs-core-sync between them.
mailrs-fastcore = { path = "../fastcore" }
mailrs-mailbox-kevy = { path = "../mailbox-kevy" }
mailrs-core-sync = { path = "../core-sync" }
kevy-embedded = { workspace = true }

[[bin]]
name = "mailrs-pg-core"
path = "src/bin/pg_core.rs"
