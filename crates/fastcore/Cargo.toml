[package]
name = "mailrs-fastcore"
version.workspace = true
edition = "2024"
description = "Kevy-backed `mailrs-core-api` server. Drop-in for the PG/spg core when the workload fits the cascade-killer KV layout."
license = "Apache-2.0 OR MIT"
publish = false

[lints]
workspace = true

[[bin]]
name = "mailrs-fastcore"
path = "src/main.rs"

[[bin]]
name = "mailrs-fastcore-migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "mailrs-fastcore-backfill-contacts"
path = "src/bin/backfill_contacts.rs"

[[bin]]
name = "mailrs-fastcore-backfill-uid-index"
path = "src/bin/backfill_uid_index.rs"

[[bin]]
name = "mailrs-fastcore-backfill-usage"
path = "src/bin/backfill_usage.rs"

[[bin]]
name = "mailrs-fastcore-sender"
path = "src/bin/sender/main.rs"

[dependencies]
mailrs-apns = { path = "../apns", version = "1" }
mailrs-core-api = { path = "../core-api", features = ["server", "client"] }
mailrs-core = { path = "../core" }
mailrs-mailbox-kevy = { path = "../mailbox-kevy" }
mailrs-rfc5322 = { path = "../rfc5322", version = "1" }
mailrs-bayes = { path = "../bayes" }
mailrs-clean = { path = "../clean" }
mailrs-intelligence = { path = "../intelligence" }
mailrs-triage = { path = "../triage" }
mailrs-alias-store = { path = "../alias-store" }
mailrs-alias-store-net = { path = "../alias-store-net" }
mailrs-smtp-client = { path = "../smtp-client" }
mailrs-outbound-queue = { path = "../outbound-queue" }
# rustls crypto provider must be installed once per process before any
# TLS config is built (STARTTLS in the sender daemon). Match the
# receiver binary's version + feature set.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12", "std"] }
kevy-embedded = { workspace = true }
kevy-client = { workspace = true }
mailrs-core-sidestate = { path = "../core-sidestate" }
axum = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
rand_core = { workspace = true }
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
html2text = "0.17"
mailrs-fraud = { path = "../fraud", version = "0" }
mailrs-inbound = { path = "../inbound", version = "1" }
mailrs-mime = { path = "../mime", version = "2" }
mailrs-rfc2047 = { path = "../rfc2047", version = "1" }
mailrs-srs = { path = "../srs", version = "1" }
mailrs-mta-sts = { path = "../mta-sts", version = "2" }
mailrs-backoff = { path = "../backoff", version = "1" }
mailrs-tls-rpt = { path = "../tls-rpt", version = "1" }
mailrs-acme = { path = "../acme", version = "1" }
mailrs-tls-reload = { path = "../tls-reload", version = "1" }
instant-acme = "0.8"
mailrs-sieve = { path = "../sieve" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
mailrs-imap-proto = { path = "../imap-proto", version = "2" }
mailrs-imap-codec = { path = "../imap-codec" }
mailrs-imap-format = { path = "../imap-format" }
mailrs-maildir = { path = "../storage-maildir" }
mailrs-uidlist = { path = "../uidlist", version = "0" }
mailrs-keywords = { path = "../keywords", version = "0" }
mailrs-threadstate = { path = "../threadstate", version = "0" }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
mailrs-dmarc = { version = "2.0.0", path = "../dmarc", default-features = false }
mailrs-arf = { version = "1.0.0", path = "../arf" }
mailrs-arc = { version = "3.0.0", path = "../arc" }
mailrs-dkim = { version = "3.0.0", path = "../dkim" }
psl = "2.1.222"

# Calendar feed parsing — the same stone the monolith's feed worker uses,
# including the VEVENT splitter.
mailrs-ical = { path = "../ical", version = "2", features = ["mime"] }
# Webhook delivery signing (HMAC-SHA256), same stone the monolith uses.
mailrs-webhook-signature = { path = "../webhook-signature", version = "1" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
