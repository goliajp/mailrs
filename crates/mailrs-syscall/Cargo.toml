[package]
name = "mailrs-syscall"
version = "0.1.0"
edition = "2024"
description = "Raw Linux syscalls (mmap, munmap, madvise, gettid) without libc and without dependencies, for an allocator that must not call back into libc. x86_64 and aarch64 Linux; other targets get stubs so a workspace still builds there."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
homepage = "https://github.com/goliajp/mailrs"
documentation = "https://docs.rs/mailrs-syscall"
authors = ["GOLIA K.K."]
keywords = ["syscall", "no-libc", "linux", "mmap", "madvise"]
categories = ["os::linux-apis", "external-ffi-bindings"]
readme = "README.md"

[lints]
workspace = true
