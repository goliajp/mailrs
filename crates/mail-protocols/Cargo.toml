[package]
name = "mailrs-mail-protocols"
version.workspace = true
edition = "2024"
description = "The IMAP, POP3 and ManageSieve sessions and listeners both mailrs cores serve, over a storage trait each core implements."
license = "Apache-2.0 OR MIT"
publish = false

[lints]
workspace = true

[dependencies]
mailrs-imap-proto = { path = "../imap-proto", version = "2" }
mailrs-imap-codec = { path = "../imap-codec" }
mailrs-imap-format = { path = "../imap-format" }
mailrs-maildir = { path = "../storage-maildir" }
# SASL PLAIN decoding for IMAP AUTHENTICATE
mailrs-smtp-proto = { path = "../smtp-proto", version = "1" }
mailrs-sieve = { path = "../sieve" }
mailrs-tls-reload = { path = "../tls-reload", version = "1" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
tracing = "0.1"
thiserror = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

[dev-dependencies]
tempfile = "3"
# self-signed certificates for the STARTTLS / STLS tests
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12", "std"] }
