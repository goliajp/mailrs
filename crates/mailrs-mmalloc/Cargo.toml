[package]
name = "mailrs-mmalloc"
version = "0.1.0"
edition = "2024"
description = "mmap-backed global allocator for Linux x86_64 and aarch64 (page bump, size-class free lists, thread-local caches, direct mmap for large blocks). Freed pages are returned to the OS with madvise(MADV_DONTNEED), so resident memory falls when load does. On other targets MailrsAllocator delegates to the system allocator."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
homepage = "https://github.com/goliajp/mailrs"
documentation = "https://docs.rs/mailrs-mmalloc"
authors = ["GOLIA K.K."]
keywords = ["allocator", "mmap", "madvise", "no-libc", "global-allocator"]
categories = ["memory-management"]
readme = "README.md"

[dependencies]
mailrs-syscall = { path = "../mailrs-syscall", version = "0.1" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "alloc"
harness = false

[lints]
workspace = true
