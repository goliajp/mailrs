[package]
name = "mailrs-core-sidestate"
version = "0.0.1"
edition = "2024"
description = "Shared network-kevy side-state handlers (drafts/signatures/templates/webhooks/audit/contacts/analysis/outbound/groups/apikeys/sieve) mounted identically by both mailrs cores (fastcore + pg-core) so their contract behaviour is byte-identical. v2 point 3."
license = "Apache-2.0 OR MIT"
publish = false

[lints]
workspace = true

[lib]
name = "mailrs_core_sidestate"
path = "src/lib.rs"

[dependencies]
mailrs-fraud = { path = "../fraud", version = "0" }
mailrs-mock = { path = "../mock" }
mailrs-core-api = { path = "../core-api", features = ["server"] }
kevy-client = { workspace = true }
axum = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Address comparison for webhook sender filters — the same stone the
# mailbox uses, so `Name <a@b>` and `a@b` are one address here too.
mailrs-rfc5322 = { path = "../rfc5322", version = "1" }
base64 = "0.22"
rand_core = { workspace = true }
sha2 = "0.11"
# CalDAV / CardDAV storage over the event and contact rows.
mailrs-dav = { path = "../dav", version = "2" }
mailrs-ical = { path = "../ical", version = "2" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
mailrs-test-docker = { path = "../test-docker" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
