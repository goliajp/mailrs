[package]
name = "mailrs-receiver"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "The mailrs SMTP receiver: accepts mail on 25/465/587, runs the inbound pipeline, and writes accepted mail to the spool for the core to deliver."
publish = false

[lints]
workspace = true

# The standalone receiver process (P6): SMTP I/O + anti via kevy-server +
# antispam + spool write + SpoolDelivered notify. Zero spg / PG.
[[bin]]
name = "mailrs-receiver"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
mailrs-message-store = { path = "../message-store" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared session infra (event bus, UserStore, LdapConfig) + hot-reload TLS.
mailrs-core = { path = "../core" }
mailrs-core-api = { path = "../core-api", features = ["client"] }
mailrs-tls-reload = { path = "../tls-reload", version = "1" }
# rustls crypto provider must be installed once per process before any TLS
# config is built (SMTPS/STARTTLS). The server binary does this in its run();
# the standalone receiver binary must do the same or rustls panics on first use.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12", "std"] }

# Inbound receiving pipeline + anti subsystems. mailrs-shield / mailrs-dmarc
# are pulled without their default features: the receiver uses only the
# backend-generic surface (GreylistDb over a GreylistBackend trait, the
# DMARC verifier), so it carries no SQL driver and no embedded kevy.
mailrs-core-sidestate = { path = "../core-sidestate" }
mailrs-fraud = { path = "../fraud", version = "0" }
mailrs-fraud-lua = { path = "../fraud-lua", version = "0" }
mailrs-inbound = { path = "../inbound", version = "2" }
mailrs-bayes = { path = "../bayes" }
# the spam corpus keys the scorer reads, defined where training writes them
mailrs-triage = { path = "../triage" }
mailrs-rfc5322 = { path = "../rfc5322", version = "1" }
mailrs-shield = { path = "../shield", version = "5", default-features = false, features = ["store"] }
mailrs-dmarc = { path = "../dmarc", version = "3", default-features = false }
mailrs-spf = { path = "../spf", version = "3" }
mailrs-dkim = { path = "../dkim", version = "3" }
mailrs-arc = { path = "../arc", version = "3" }
mailrs-intelligence = { path = "../intelligence", version = "4" }
mailrs-auth-guard = { path = "../auth-guard", version = "2" }
mailrs-rate-limit = { path = "../rate-limit", version = "1" }
mailrs-clamav = { path = "../clamav", version = "1" }
# Network kevy-server client for the receiver/core split: greylist/rate/auth
# state + SpoolDelivered notify go over kevy:// instead of in-process.
kevy-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# SMTP session machinery. mailrs-outbound-queue is pulled without its `pg`
# feature: the receiver binds only the Notifier / QueueStore trait
# surfaces, never the SQL-backed PgQueueStore.
mailrs-smtp-proto = { path = "../smtp-proto", version = "1" }
mailrs-smtp-codec = { path = "../smtp-codec", version = "1" }
mailrs-rfc2047 = { path = "../rfc2047", version = "1" }
mailrs-mime = { path = "../mime", version = "2" }

tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros", "net", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
hickory-resolver = "0.26"
ipnet = { workspace = true }
metrics = "0.24"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
tracing = "0.1"
bytes = "1"
memchr = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
argon2 = { workspace = true }

[dev-dependencies]
# tests/kevy_network.rs runs the network anti backends and the notify bridge
# against a real kevy-server container.
testcontainers = "0.27"
mailrs-test-docker = { path = "../test-docker" }
