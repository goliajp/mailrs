[package]
name = "mailrs-backup"
version = "0.0.0"
edition = "2024"
publish = false
description = "Daily encrypted backups of a mailrs server's stores and mail."
license = "Apache-2.0 OR MIT"

[lints]
workspace = true

[dependencies]
age = "0.11"
chrono = { workspace = true }
kevy-client = { workspace = true }
libc = "0.2"
mailrs-core-api = { path = "../core-api" }
mailrs-auth-guard = { path = "../auth-guard", features = ["kevy"] }
mailrs-core-sidestate = { path = "../core-sidestate" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tar = "0.4.46"
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mailrs-backup"
path = "src/bin/mailrs-backup.rs"
