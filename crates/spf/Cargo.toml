[package]
name = "mailrs-spf"
version = "3.0.0"
edition = "2024"
description = "RFC 7208 Sender Policy Framework verifier. Pure-Rust evaluator with a pluggable DNS resolver trait; ships an optional hickory-resolver-backed implementation. Bounded DNS-lookup limits + loop detection per spec."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
homepage = "https://github.com/goliajp/mailrs"
documentation = "https://docs.rs/mailrs-spf"
authors = ["GOLIA K.K."]
keywords = ["spf", "rfc7208", "email", "auth", "smtp"]
categories = ["email", "network-programming"]
readme = "README.md"

[lints]
workspace = true

[features]
default = ["hickory"]
# Ship a ready-made `SpfResolver` impl backed by `hickory-resolver`.
# Disable if you have your own DNS layer to plug in.
hickory = ["dep:hickory-resolver"]

[dependencies]
memchr = "2"
async-trait = "0.1"
hickory-resolver = { version = "0.26", optional = true }
# Inline-short-string for Mechanism::{A,Mx,Include,Exists}.domain — see mailrs-dkim 2.0.
compact_str = "0.9"

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true }
# Comparator for honest head-to-head benches. Without `report`, which
# would pull in zip and quick-xml for DMARC report parsing the benches
# never touch.
mail-auth = { version = "0.13", default-features = false, features = ["aws-lc-rs"] }
dhat = "0.3"   # mem profile (examples/dhat_profile.rs)

[[bench]]
name = "spf"
harness = false

[[bench]]
name = "compare_mail_auth"
harness = false

[[example]]
name = "dhat_profile"
path = "examples/dhat_profile.rs"
