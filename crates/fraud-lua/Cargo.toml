[package]
name = "mailrs-fraud-lua"
version = "0.0.0"
edition = "2024"
description = "Scripted fraud rules — a sandboxed Lua VM that turns a rule set into findings, so a new phishing shape does not need a release."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
authors = ["GOLIA K.K."]
publish = false

[lints]
workspace = true

[dependencies]
mailrs-fraud = { path = "../fraud", version = "0" }
luna-jit = "=3.0.0"
tracing = "0.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mailrs-inbound = { path = "../inbound", version = "1" }
mailrs-mime = { path = "../mime", version = "2" }
kevy-client = { workspace = true }
mailrs-core-sidestate = { path = "../core-sidestate", version = "0" }
