[package]
name = "mailrs-oauth-client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "OAuth 2.0 / OIDC relying-party primitives: authorization URLs with PKCE, token exchange, and identity extraction across providers that disagree about how to describe a person. Pure apart from two HTTP calls, so the URL building, the PKCE derivation and the claim reading are testable without a network."
repository = "https://github.com/goliajp/mailrs"
keywords = ["oauth2", "oidc", "pkce", "sso", "login"]
categories = ["authentication", "web-programming"]

[lints]
workspace = true

[features]
default = []
# The one HTTP call this crate makes on its own: renewing an access
# token. Off by default so the URL building, the PKCE derivation and
# the claim reading stay testable without a network stack — and on
# for the two callers that renew, so they share one renewal rather
# than each writing their own.
net = ["dep:reqwest"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
base64 = "0.22"
rand_core = { workspace = true }
thiserror = "2"
