[package]
name = "mailrs-auth-guard"
version = "2.1.0"
edition = "2024"
description = "Per-IP + per-(IP, username) failed-auth counter with exponential-backoff lockout. IPv6 normalized to /64 prefix. Sharded DashMap; allocation-free on the success path."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
homepage = "https://github.com/goliajp/mailrs"
documentation = "https://docs.rs/mailrs-auth-guard"
authors = ["GOLIA K.K."]
keywords = ["auth", "rate-limit", "lockout", "smtp", "imap"]
categories = ["authentication", "network-programming"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
dashmap = "6"
tracing = "0.1"
mailrs-backoff = { path = "../backoff", version = "1" }
async-trait = "0.1"
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
kevy-client = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
# The login guard over a shared kevy server.
kevy = ["dep:kevy-client", "dep:tokio"]

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[[bench]]
name = "guard"
harness = false
