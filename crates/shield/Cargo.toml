[package]
name = "mailrs-shield"
version = "5.0.0"
edition = "2024"
description = "SMTP anti-spam primitives: DNS blocklist (DNSBL) queries, greylisting policy with optional in-process kevy store, and PTR / forward-confirmed reverse DNS (FCrDNS) checks."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/mailrs"
homepage = "https://github.com/goliajp/mailrs"
documentation = "https://docs.rs/mailrs-shield"
authors = ["GOLIA K.K."]
keywords = ["smtp", "anti-spam", "dnsbl", "greylist", "fcrdns"]
categories = ["email", "network-programming"]
readme = "README.md"

[lints]
workspace = true

[features]
default = ["kevy-store"]
# The greylist store: `GreylistDb` over a pluggable `GreylistBackend`.
store = ["dep:async-trait"]
# The in-process kevy backend for it, `EmbeddedGreylistBackend`.
kevy-store = ["store", "dep:kevy-embedded"]

[dependencies]
mailrs-dnsbl = { path = "../dnsbl", version = "1" }
hickory-resolver = "0.26"

# kevy-store feature
kevy-embedded = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ops"
harness = false
