[workspace.package]
version = "0.0.0"
# v2.3 (2026-07-10): pin MSRV to the toolchain CI + rust-toolchain.toml
# lock in. Every published stone advertises this floor; downstream
# consumers see it in crates.io metadata. Bump this in lock-step with
# rust-toolchain.toml so the two never drift.
rust-version = "1.97"

[workspace]
resolver = "2"
members = [
    "crates/test-docker",
    "crates/perf-recipes",
    "crates/fraud",
    "crates/fraud-lua",
    "crates/smtp-proto",
    "crates/storage-maildir",
    "crates/uidlist",
    "crates/keywords",
    "crates/textguard",
    "crates/threadstate",
    "crates/message-store",
    "crates/receiver",
    "crates/core",
    "crates/smtp-client",
    "crates/outbound-queue",
    "crates/mailprovider",
    "crates/mailbox",
    "crates/imap-proto",
    "crates/ical",
    "crates/intelligence",
    "crates/clean",
    "crates/dmarc",
    "crates/postmaster",
    "crates/shield",
    "crates/jmap",
    "crates/pop3-client",
    "crates/jmap-client",
    "crates/dav",
    "crates/inbound",
    "crates/rate-limit",
    "crates/rfc2047",
    "crates/rfc5322",
    "crates/auth-guard",
    "crates/srs",
    "crates/rfc2231",
    "crates/oauth-client",
    "crates/webhook-signature",
    "crates/dnsbl",
    "crates/clamav",
    "crates/backoff",
    "crates/bayes",
    "crates/triage",
    "crates/mailrs-syscall",
    "crates/mailrs-mmalloc",
    "crates/tls-reload",
    "crates/acme",
    "crates/spf",
    "crates/dkim",
    "crates/mime",
    "crates/dns",
    "crates/arc",
    "crates/mta-sts",
    "crates/tls-rpt",
    "crates/smtp-codec",
    "crates/imap-client",
    "crates/imap-codec",
    "crates/imap-format",
    "crates/attachment-extract",
    "crates/sieve",
    "crates/sieve-core",
    "crates/delivery-executor",
    "crates/arf",
    "crates/mail-builder",
    "crates/server",
    "crates/core-api",
    "crates/webapi",
    "crates/secretbox",
    "crates/sender",
    "crates/mailbox-kevy",
    "crates/fastcore",
    "crates/pg-dump",
    "crates/core-sync",
    "crates/core-sidestate",
    "crates/alias-store",
    "crates/apns",
    "crates/alias-store-net",
]

[workspace.dependencies]
# Async runtime + protocols.
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Storage + cache.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono"] }
# spg-sqlx — sqlx 0.8 Database driver over spg-embedded (in-process SQL
# engine, PG dialect). Behind the per-crate `spg` feature: stones keep
# PG as the default backend; the server binary flips the workspace to
# the embedded backend at build time.
# 2026-08-13: 7.37.12 → 7.37.16 as part of reactivating this lane. The two
# defects that held it out of production are inside the version it was already
# pinned to and were never exercised, because a dormant lane cannot be:
# connection-pool exhaustion and a crash-recovery hang, closed at .8 (V5
# ROW_REDO on by default) and .11/.12 (process-wide `open_path` dedup). Five of
# the ten releases before .12 are named for mailrs recurrences of those two.
spg-sqlx = "7.38.4"
spg-embedded = "7.38.4"
# kevy-embedded — in-process RESP-compatible KV store with AOF + snapshot
# persistence + native pub/sub bus. Zero network hop. The only kvdb
# backend mailrs ships with after Phase C (v1.7.95+); the `redis` crate
# dep is gone.
#
# 2026-08-13: 4.1.1 → 5.1; 2026-08-23: 5.2 → 5.4.1. **These lines move
# together.** The client's 2.2 line depends on the 5.x shared crates, so
# bumping one without the other compiles both generations of
# kevy-store / kevy-persist / kevy-resp into a single binary — the same
# duplication `check-workspace-deps.sh` exists to catch on our own
# crates.
#
# The 5.4.1 lift needed a third: `kevy-client` 2.2 pins
# `kevy-resp-client`, which stayed on 5.2.0 after the other twelve
# moved. `grep -c 'version = "5.2.0"' Cargo.lock` is how that shows —
# it read 1 while everything compiled cleanly, which is exactly the
# duplication this comment warns about and exactly what a green build
# does not tell you. `cargo update -p kevy-resp-client` closed it.
#
# Nothing the compiler forced, on either the 5.4 or the resp-client
# step: `cargo check --workspace --all-targets` was clean before and
# after, and mailbox-kevy's 194 tests plus the three upstream-property
# tests passed unchanged. So this is a version lift.
#
# The embedded API was diffed name-by-name before the bump: 238 public
# functions against 235, nothing removed, no signature changed, three
# arrivals (`idx_advise`, `idx_usage`, `idx_count_claused`). The client's
# surface is byte-identical across the same jump. So this is a version
# lift, and any change the compiler forces is a finding.
#
# What it is for, since it is not correctness this code was losing — of
# the three defects 5.0 closed that looked like they might reach us, none
# do (`crates/mailbox-kevy/tests/kevy_upstream_properties.rs` records why):
#   - giant collections copy on write at element granularity, so a write
#     inside a rewrite window clones one segment instead of the whole
#     value. We hold 23k-member indexes and 140k keys, and the old cost
#     was 0.35–9.5 s with the collection's memory briefly doubled — the
#     shape of the 2026-07-17 AOF incident.
#   - `appendfsync always` group-commits on both reactors.
#   - a forced rewrite no longer spikes the reactor for ~200 ms.
# Data directories open in both directions; the release gate replays that.
# 6.2.1, from 5.4.1. The major is the milestone's name, not a break:
# the changelog's own evidence is 1,871 public names at 5.4.1 and the
# same 1,871 at 6.0.0, none added or removed, with the wire protocol,
# the on-disk formats and the replication stream untouched — so a data
# directory written by 5.4 opens, which is the only question that
# matters to a deployment holding 36k messages. Verified against a
# copy of production rather than reasoned about.
#
# One behaviour changed in 6.2: `-0` and `0` are one score, so a
# member stored at `-0` moves among others scored `±0`. Every score
# this project writes is a timestamp or a count.
# 6.2.2 fixes what this project's own test suite reported: several
# tests opening one persist directory at once. The second `Store`
# appended its own `KEVYAOF2` magic into the first one's live AOF and
# the next replay quarantined it silently — the same shape as the
# `docker exec` backfill that opened `/data/kevy-fastcore` beside a
# running fastcore. Every engine now claims its directory with an
# advisory `flock` and a second open errors instead of interleaving.
#
# **That makes a deliberate double-open an error**, and four binaries
# in the image do exactly that: `mailrs-fastcore-{migrate,
# backfill-contacts,backfill-uid-index,backfill-usage}` all open
# `MAILRS_KEVY_DATA_DIR`. Run them against a stopped fastcore, which
# is what they always needed and now say so.
#
# 6.3.0 is additive here. The public surface goes 238 -> 239 with one
# arrival (`hrandfield`) and nothing removed; the client's 108 names are
# unchanged. What the release is mostly about is upstream's own gates —
# ten benchmark anchors pinned to exact versions, and a RESP3 gate that
# found five verbs replying with the wrong RESP3 type. None of the five
# reach us: `hello3` is called nowhere in this tree, so every connection
# is RESP2, and `ZPOPMIN` / `ZADD .. INCR` / `GEOPOS` / `SPOP key count` /
# `HRANDFIELD .. WITHVALUES` appear in no mailrs code path. `CONFIG SET
# notify-keyspace-events` is wired to the wire for the first time; this
# project does not use keyspace notifications either.
kevy-embedded = "6.4.0"
# kevy-client — synchronous RESP network client for a shared kevy-server.
# Used when MAILRS_KEVY_URL is set: webapi's sessions and the fifteen
# core-sidestate families, plus the anti subsystems (greylist / rate /
# auth-guard). Blocking `&mut self` client → wrapped in spawn_blocking.
#
# It used to carry a version line of its own — 2.x, on the theory that a
# client's API grows at its own pace — and that is why 6.2.1 exists: the
# published 2.2.0 still asked for `kevy-embedded ^5.0` while every sibling
# pin in the tree read 6.x. Since 6.2.1 it moves with the workspace, so
# **this line and the one above are bumped together, always**. Its public
# surface is unchanged again at 6.3.0 (108 names, no additions, no
# removals).
#
# `cargo info` can report a stale latest from the local cache — check the
# sparse index (`curl -s https://index.crates.io/ke/vy/kevy-client`), not
# the cache.
kevy-client = "6.4.0"

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Password hashing — shared by the server (web/imap/pop3/mcp auth) and
# mailrs-core (the UserStore credential file). password-hash + rand_core
# pinned to older majors — argon2 0.5.x (latest) hard-deps password-hash
# 0.5, and rsa 0.9.x (latest) hard-deps rand_core 0.6. Unpin when argon2
# 0.6 / rsa 0.10 publish.
argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["std"] }

# Time + DNS — used in 5+ crates each, pin centrally so a future bump
# rolls through the workspace in one commit.
chrono = "0.4"
hickory-resolver = "0.26"

# IP / CIDR parsing — used by greylist local-lists (Phase 2) for IP-range
# rules. ipnet handles both v4 and v6 with a single IpNet enum.
ipnet = "2"

# Bench harness — every published crate uses the same criterion config
# (no default features, cargo_bench_support only). Pinning here makes
# upgrades atomic.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny" }

# Performance-first release profile.
#
# mailrs's positioning: "modern Rust implementation of legacy email
# protocols, performance-first". Default cargo release tunes for compile
# time; we trade compile time for runtime quality.
#
# - lto = "fat": linker inlines + DCE's across crate boundaries,
#   including across mailrs-* library boundaries. Non-negotiable for an
#   SMTP/IMAP server where every µs in the handler matters.
# - codegen-units = 1: single CGU per crate, optimizer sees every
#   callee. Costs build time, recovers in binary quality.
# - panic = "abort": no unwinding tables. Server panics terminate the
#   process anyway (supervisor restarts). ~15-30% smaller binary,
#   slightly faster Result-heavy hot paths.
# - strip = "symbols": lean deploy binary.
# - overflow-checks = false: release default, made explicit to prevent
#   accidental flip.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false
incremental = false

# Perf-investigation profile: same optimization as release, keeps line
# tables so flamegraphs / perf record / Instruments can attribute
# samples. Use with `cargo build --profile release-debug`.
[profile.release-debug]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Vanilla release profile — defaults restored. Exists solely so we can
# compare the perf-first profile against an honest baseline (see
# `crates/server/benches/smtp_load.rs` and PERFORMANCE.md row for commit
# 9f21e0b). Not for deploy: produces the larger / slower-Result-path
# binary the perf-first profile was introduced to avoid.
#
# Use with `cargo build --profile release-vanilla -p mailrs-server`.
[profile.release-vanilla]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"

[profile.dev]
# debug=1 (line tables) instead of the default 2 (full DWARF). Backtraces keep
# file and line; what is lost is variable inspection in a debugger, which this
# project's workflow does not use. Measured 2026-08-28: target/debug/deps is
# the largest single thing on these machines — 104 GB in smix alone — and the
# debug info is most of it.
debug = 1
# macOS defaults to "unpacked", which leaves every compile's object files in
# target/debug/deps and never removes them: 97,088 of that directory's
# 103,155 entries on 2026-09-28. Each freshly linked test binary's first exec
# gets slower as the directory grows. "packed" writes one .dSYM per binary
# instead, and backtraces keep file and line. Linux behaves the same either way.
split-debuginfo = "packed"
