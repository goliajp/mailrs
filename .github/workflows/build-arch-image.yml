# Build + push the 4-binary split image for arch/** branches.
#
# Stops at the ghcr push and deploys nothing: arch/** branches are
# experimental, and the resulting `ghcr.io/goliajp/mailrs:arch-<suffix>`
# image is there for a manual `docker pull`.
#
# Image tag: `arch-<branch-suffix>` (e.g. `arch-split-fastcore`).

name: build-arch-image

on:
  push:
    branches: ["arch/**"]

concurrency:
  group: build-arch-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: goliajp/mailrs

jobs:
  build:
    name: build + push arch image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: derive image tag from branch
        id: tag
        run: |
          # github.ref_name is "arch/split-fastcore";
          # turn it into "arch-split-fastcore" (slashes -> dashes).
          branch="${{ github.ref_name }}"
          tag="${branch//\//-}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Image tag: $tag"

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push arch image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          build-args: |
            VERSION=0.0.0-${{ steps.tag.outputs.tag }}+${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          push: true
          cache-from: type=gha,scope=${{ steps.tag.outputs.tag }}-arm64
          cache-to: type=gha,mode=max,scope=${{ steps.tag.outputs.tag }}-arm64
