# XcodeGen spec — the project's source of truth.
#
# `Mailrs.xcodeproj` is generated from this and is NOT in git: a pbxproj
# is a 2,000-line machine-written blob that conflicts on every parallel
# edit, and none of it is information this file does not already carry.
# Regenerate with `xcodegen generate` (or `./scripts/ios-build.sh`,
# which does it for you).
name: Mailrs
options:
  bundleIdPrefix: jp.golia
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # GOLIA K.K. Set now so device builds work the moment an Apple
    # Development certificate exists on this team — the simulator does
    # not need one, and the certificate currently on this machine for
    # KF79DRC524 is a Developer ID (macOS) cert, which cannot sign iOS.
    DEVELOPMENT_TEAM: KF79DRC524
    CODE_SIGN_STYLE: Automatic
    # Strict concurrency is the default in Swift 6 language mode; stated
    # here so it is a decision rather than an accident of the toolchain.
    SWIFT_STRICT_CONCURRENCY: complete
    # A TestFlight or App Store build is refused without both of these,
    # and `GENERATE_INFOPLIST_FILE` does not invent them — the first
    # archive built cleanly, signed correctly, and had no version at all
    # in its Info.plist. Installing on a phone does not care, which is
    # why nothing had noticed.
    #
    # MARKETING_VERSION is what a person sees; CURRENT_PROJECT_VERSION
    # is the build number, and App Store Connect refuses a second upload
    # that reuses one. Bump the build for every upload of the same
    # version.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Both targets, not just the app: a test bundle is code-signed too,
    # and without this the build fails at the signing step with a message
    # about Info.plist that reads like an app-target problem.
    GENERATE_INFOPLIST_FILE: "YES"
    # Named explicitly: xcodegen does not assume the template defaults,
    # and without these the catalog compiles but nothing points at it.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Without these the String Catalog compiles only the source
    # language, and an in-app language picker has nothing to pick.
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"

# Running the tests from Xcode has to work too, not only through
# `scripts/ios-build.sh`. Without this, ⌘U starts no stub and every UI
# test reports "inbox never listed" — an app-shaped message for a
# missing dependency.
schemes:
  # A scheme of its own. Sharing the iOS scheme would run the Mac's
  # tests wherever that scheme points, which is how the iPad's screens
  # ended up being run on a phone and failing six times for a reason
  # that was a lane boundary rather than a defect.
  MailrsMac:
    build:
      targets:
        MailrsMac: all
        MailrsMacUITests: [test]
    test:
      targets: [MailrsMacUITests]
      preActions:
        - name: start stub API
          script: |
            cd "$PROJECT_DIR"
            pkill -f "Testing/stub-api.py" 2>/dev/null || true
            sleep 0.3
            nohup python3 Testing/stub-api.py 6039 >/tmp/mailrs-mac-stub.log 2>&1 &
          settingsTarget: MailrsMac
      postActions:
        - name: stop stub API
          script: |
            pkill -f "Testing/stub-api.py" 2>/dev/null || true
          settingsTarget: MailrsMac

  Mailrs:
    build:
      targets:
        Mailrs: all
        MailrsTests: [test]
        MailrsUITests: [test]
    test:
      targets: [MailrsTests, MailrsUITests]
      preActions:
        - name: start stub API
          script: |
            cd "$PROJECT_DIR"
            # Kill then start, rather than reusing whatever holds the
            # port: a stub left over from an earlier run is an older
            # build of the stub, and the tests then measure that.
            pkill -f "Testing/stub-api.py" 2>/dev/null || true
            sleep 0.3
            nohup python3 Testing/stub-api.py 6039 >/tmp/mailrs-ios-stub.log 2>&1 &
          settingsTarget: Mailrs
      postActions:
        - name: stop stub API
          script: |
            # The pre-action's nohup outlives the test run; without this
            # every ⌘U leaves one python process holding :6039 forever.
            pkill -f "Testing/stub-api.py" 2>/dev/null || true
          settingsTarget: Mailrs

targets:
  Mailrs:
    type: application
    platform: iOS
    sources:
      - path: Mailrs
    dependencies:
      # The rows live in a SQLite table (Accounts/MailboxDatabase.swift).
      # `import SQLite3` compiles without this and fails to link.
      - sdk: libsqlite3.tbd
    settings:
      configs:
        # The one difference between a build from Xcode and a build for
        # TestFlight, and the reason both files are hand-written rather
        # than generated: XcodeGen's `entitlements:` key writes one file
        # for every configuration, which both flattened this
        # distinction *and* rewrote the file as an empty dict on every
        # build — `aps-environment` disappeared each time, and an app
        # without it installs, runs, and silently receives nothing.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Mailrs/Mailrs.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Mailrs/Mailrs.release.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.golia.mailrs
        INFOPLIST_KEY_CFBundleDisplayName: Mailrs
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # Split by device, because the two have different rules and one
        # shared list cannot satisfy both.
        #
        # **iPad multitasking requires all four**, and App Store Connect
        # refuses the upload without them — `TARGETED_DEVICE_FAMILY` is
        # "1,2", so this is an iPad app whether or not anybody thought
        # of it that way. Installing on a phone never cared, which is
        # why the three-orientation list stood.
        #
        # iPhone keeps three: upside-down on a phone puts the earpiece
        # at the bottom, and almost no mail client offers it.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Simulator builds sign ad-hoc; nothing to configure.
        CODE_SIGNING_ALLOWED: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        # A self-hosted mail server is often on the LAN over plain HTTP,
        # and the UI tests reach a stub on localhost. This permits local
        # names only — it does not open cleartext to the internet.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true

  # The Mac app: its own scene, its own shell, its own menus.
  #
  # It shares `Accounts`, `Wire`, `Platform` and the pieces that decide
  # what a message looks like, and takes **none** of the phone's
  # screens — `App/` and most of `Features/` are iPhone navigation and
  # would be a port if they came along. `MailrsApp.swift` in particular
  # is another `@main`, and two of those do not link.
  MailrsMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: MailrsMac
      - path: Mailrs/Accounts
      - path: Mailrs/Wire
      - path: Mailrs/Platform
      - path: Mailrs/Resources
      - path: Mailrs/Assets.xcassets
      # Shared views, named one by one rather than by folder: the rest
      # of `Features/` is the phone's, and a folder include would bring
      # it silently the next time somebody adds a file there.
      - path: Mailrs/Features/ConversationRow.swift
      - path: Mailrs/Features/ConversationRowMenu.swift
      - path: Mailrs/Features/ThreadView.swift
      - path: Mailrs/Features/ThreadHeader.swift
      - path: Mailrs/Features/MessageCard.swift
      - path: Mailrs/Features/MessageBodyView.swift
      - path: Mailrs/Features/MessageSourceSheet.swift
      - path: Mailrs/Features/ComposeView.swift
      - path: Mailrs/Features/ComposerHeader.swift
      - path: Mailrs/Features/ContactSuggestions.swift
      - path: Mailrs/Features/AttachmentRow.swift
      - path: Mailrs/Features/AttachmentPicking.swift
      - path: Mailrs/Features/QuickLookSheet.swift
      - path: Mailrs/Features/SenderAvatar.swift
      - path: Mailrs/Features/SenderBadges.swift
      - path: Mailrs/Features/SenderIcons.swift
      - path: Mailrs/Features/SignInView.swift
      - path: Mailrs/Features/SendListSection.swift
      - path: Mailrs/Features/RowDateText.swift
      - path: Mailrs/Features/ValueOrPlaceholder.swift
      - path: Mailrs/Features/UnsubscribeFooter.swift
      - path: Mailrs/Features/InviteCard.swift
      - path: Mailrs/Features/Lucide.swift
      - path: Mailrs/Features/BrandMark.swift
      - path: Mailrs/Features/ReplyView.swift
      - path: Mailrs/App/Session.swift
      - path: Mailrs/App/Session+Compose.swift
      - path: Mailrs/App/Session+Directory.swift
      - path: Mailrs/App/Session+Operations.swift
      - path: Mailrs/App/Session+Selection.swift
      - path: Mailrs/App/Session+Triage.swift
      - path: Mailrs/App/MailCache.swift
      - path: Mailrs/App/Preferences.swift
      - path: Mailrs/App/Theme.swift
      - path: Mailrs/App/GlassEffects.swift
      - path: Mailrs/App/BiometricLock.swift
    settings:
      base:
        # **The same identifier as the phone app**, deliberately.
        # Apple calls this universal purchase: one app record, one
        # listing, one TestFlight, with a build per platform. A
        # separate `.mac` identifier would make Mailrs two apps that
        # happen to share a name, and somebody who has the phone app
        # would be asked to find and buy the Mac one.
        PRODUCT_BUNDLE_IDENTIFIER: jp.golia.mailrs
        INFOPLIST_KEY_CFBundleDisplayName: Mailrs
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: MailrsMac/MailrsMac.entitlements
        # Required for a Mac App Store build, with no default — the
        # first upload was refused for it after the archive, the
        # signing and the whole transfer had already succeeded.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: "YES"

  MailrsMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: MailrsMacUITests
    dependencies:
      - target: MailrsMac

  MailrsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MailrsUITests
    dependencies:
      - target: Mailrs

  MailrsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MailrsTests
    dependencies:
      - target: Mailrs
