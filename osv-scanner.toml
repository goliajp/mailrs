# Accepted findings for scripts/check-osv.sh. Each entry says why it does
# not apply here; keep it in step with the matching ignore in deny.toml.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa Marvin attack: RSA is used only for DKIM signing and verification, which expose no per-operation timing to an attacker; no fixed version exists"

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-31T00:00:00Z
reason = "block-buffer 0.10.4 under digest 0.10 (blake2/argon2, sha1, sha2, md-5, hmac, curve25519-dalek): the cursor is corrupted only when a compress callback panics and the caller catches it and keeps using the same hasher; the RustCrypto compression functions do not panic, and the one catch_unwind (PDF text extraction) drops everything built inside it; no fixed 0.10.x exists, the fix is 0.12.1, which the fuzz lockfiles already use; no RUSTSEC id yet, so deny.toml has nothing to match"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0374"
reason = "basic-toml is unmaintained, not vulnerable, and used only at build time by the proc-macros age loads its bundled translations with; never reads input at run time and is in no binary; matches deny.toml"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0173"
reason = "proc-macro-error2 is unmaintained, not vulnerable, and used only at build time by the proc-macros age loads its bundled translations with; in no binary; matches deny.toml"

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31T00:00:00Z
reason = "minimatch pattern amplification needs an attacker-supplied glob; in web/bun.lock it is only under eslint, its plugins and the openapi type generator, which read globs from this repository's own config at build time and ship nothing to the browser; fixed in 11.0.1, which none of them accept yet; npm only, so deny.toml has nothing to match"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0440"
reason = "astral-tokio-tar is unmaintained, not vulnerable, and used only by testcontainers in the test-only crate mailrs-test-docker; in no shipped binary; the latest testcontainers (0.28.0) still depends on it; matches deny.toml"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2027-01-31T00:00:00Z
reason = "bundled SQLite before 3.54 can return uninitialized memory when it opens a database with a crafted -wal file; only mailrs-ops links it, and it opens only its own database in its own volume; libsqlite3-sys 0.39 conflicts with sqlx 0.8's pin of 0.30 through links = sqlite3, so the fix goes with the sqlx 0.9 upgrade; matches deny.toml"

